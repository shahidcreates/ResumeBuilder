spring.application.name=ResumeBuilder

spring.datasource.url=DataBase
spring.datasource.username=username
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql=true

#Email Configuration
spring.mail.host=host name
spring.mail.port=Port no
spring.mail.username=userName
spring.mail.password=Password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=Mail Id



#Application info
app.base.url=http://localhost:8080

#Cloudinary info
cloudinary.cloud-name=Name
cloudinary.api-key=Pass Key
cloudinary.api-secret=Secret

#Jwt configuration
jwt.secret=your-secret-key-here-change-this-in-production-with-more-secure-and-complicated-key
jwt.expiration=604800000
