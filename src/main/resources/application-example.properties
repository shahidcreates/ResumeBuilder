spring.application.name=ResumeBuilder

spring.datasource.url= DATABASE URL
spring.datasource.username=DATABASE USERNAME
spring.datasource.password=DATABASE PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql=true

#Email Configuration
spring.mail.host= HOST_NAME
spring.mail.port=MAIL_PORT
spring.mail.username=MAIL_USERNAME
spring.mail.password=MAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=MAIL_FROM
spring.mail.properties.mail.debug=true


#Application info
app.base.url= APPLICATION URL

#Cloudinary info
cloudinary.cloud-name= CLOUD_NAME
cloudinary.api-key=CLOUD_KEY
cloudinary.api-secret=CLOUD_SECRET

#Jwt configuration
jwt.secret=your-secret-key-here-change-this-in-production-with-more-secure-and-complicated-key
jwt.expiration= EXPIRATION_TIME

management.endpoint.health.show-details=always
#management.health.mail.enabled=false
